name: Continuous Deployment

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v1

    - name: 🔑 Cache Key
      id: cache_key
      run: echo "key=$(md5sum stack.yaml | awk '{print $1}')" >> "$GITHUB_OUTPUT"

    - name: 💾 Cache Dependencies
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.stack
        key: ${{ matrix.os }}-${{ steps.cache_key.outputs.key }}

    - name: 🏷️ Variables
      id: variables
      run: |
        echo "pkg_name=$(sed -n 's/^name:[[:space:]]*//p' *.cabal)" >> "$GITHUB_OUTPUT"

    - name: 🔨 Build
      run: |
        stack --no-terminal run build

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      if: ${{ github.ref == 'refs/heads/main' }}
      with:
        publish_dir: ./_site
        external_repository: russellmcc/russellmcc.github.com
        publish_branch: main
        deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
